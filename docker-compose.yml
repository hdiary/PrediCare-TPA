# =============================================================
# PrediCare TPA - Démarrage de toute la plateforme :
#   cp .env.example .env   (puis remplir les valeurs)
#   docker compose up --build
#
# Base seule + chargement (travail de P1) :
#   docker compose up -d db loader
#
# Les variables ${...} sont lues dans le fichier .env placé à côté
# de ce fichier. Épinglez les versions d'images avant la livraison.
#
# Avant le premier démarrage (sur la machine de P1), produire les Parquet :
#   cd backend/ingestion
#   python clean.py && python encrypt_identities.py --delete-source
# =============================================================

services:
  # ---------- Base de données : PostgreSQL + pgvector ----------
  # Le schéma, les rôles et les vues sont créés par Alembic (service loader),
  # PAS par docker-entrypoint-initdb.d.
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-predicare}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_pwd}
      METABASE_RO_PASSWORD: ${METABASE_RO_PASSWORD:-dev_metabase_ro_pwd}

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-predicare}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  metabase-db-init:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-predicare}
      METABASE_RO_PASSWORD: ${METABASE_RO_PASSWORD:-dev_metabase_ro_pwd}
    command:
      - sh
      - -ec
      - |
        until pg_isready --host "$$PGHOST" --port "$$PGPORT" --username "$$PGUSER" --dbname "$$POSTGRES_DB"; do sleep 2; done
        if [ "$$(psql --dbname "$$POSTGRES_DB" --tuples-only --no-align --command "SELECT 1 FROM pg_database WHERE datname = 'metabase_app'")" != "1" ]; then
          psql --dbname "$$POSTGRES_DB" --set ON_ERROR_STOP=1 --command "CREATE DATABASE metabase_app"
        fi
        psql --dbname "$$POSTGRES_DB" --set ON_ERROR_STOP=1 --set metabase_password="$$METABASE_RO_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE metabase_ro LOGIN PASSWORD %L', :'metabase_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'metabase_ro') \gexec
        SELECT format('ALTER ROLE metabase_ro LOGIN PASSWORD %L', :'metabase_password')
        WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'metabase_ro') \gexec
        SELECT format('GRANT CONNECT ON DATABASE %I TO metabase_ro', current_database()) \gexec
        GRANT USAGE ON SCHEMA public TO metabase_ro;
        GRANT SELECT ON v_bi_factures TO metabase_ro;
        SQL
    depends_on:
      db:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
    restart: "no"

  metabase:
    image: metabase/metabase:v0.64-lts
    ports: [ "3000:3000" ]
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase_app
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: db # ← corrigé (service db, pas postgres)
      MB_SESSION_SECRET_KEY: ${MB_SESSION_SECRET_KEY:-}
    depends_on:
      metabase-db-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health" ]
      interval: 15s
      retries: 10
  metabase-init:
    image: alpine:3.20
    depends_on:
      metabase:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
    environment:
      MB_ADMIN_EMAIL: ${MB_ADMIN_EMAIL:-admin@predicare.local}
      MB_ADMIN_PASSWORD: ${MB_ADMIN_PASSWORD:-ChangeMe123!}
      POSTGRES_DB: ${POSTGRES_DB:-predicare}
      METABASE_RO_PASSWORD: ${METABASE_RO_PASSWORD:-dev_metabase_ro_pwd}
    volumes:
      - ./db/metabase/setup.sh:/setup.sh:ro
      - ./bi/dashboard.json:/dashboard.json:ro
    command: sh -c "apk add --no-cache curl jq && tr -d '\\r' < /setup.sh > /tmp/setup.sh && sh /tmp/setup.sh"
    restart: "no"
  loader:
    build:
      context: ./backend/ingestion
      dockerfile: db_init/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev_postgres_pwd}@db:5432/${POSTGRES_DB:-predicare}
      DATASET_DIR: /data/dataset
      LABELS_DIR: /data/labels
      PSEUDO_KEY: ${PSEUDO_HMAC_KEY:-0cd7db301de115d6ed662bb9320e671eb9a5f0db7d50775ba69f61fbb89c304d}
      IDENTITY_KEY: ${IDENTITY_ENCRYPTION_KEY:-4xDlFmcW7ASETxoFqZAZrq27NEcCBI8pdkHCQtdONxY=}
      IDENTITY_KEY_VERSION: ${IDENTITY_KEY_VERSION:-1}
      DB_APP_RW_PASSWORD: ${DB_APP_RW_PASSWORD:-dev_app_rw_pwd}
      DB_IDENTITY_READER_PASSWORD: ${DB_IDENTITY_READER_PASSWORD:-dev_identity_pwd}
      DB_AGENT_RO_PASSWORD: ${DB_AGENT_RO_PASSWORD:-dev_agent_ro_pwd}
      DB_BI_RO_PASSWORD: ${DB_BI_RO_PASSWORD:-dev_bi_ro_pwd}
      DB_ML_RO_PASSWORD: ${DB_ML_RO_PASSWORD:-dev_ml_ro_pwd}
    volumes:
      - ./backend/ingestion/dataset:/data/dataset:ro
      - ./backend/ingestion/labels:/data/labels:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ---------- Ingestion automatique du corpus RAG ----------
  rag-indexer:
    build:
      context: ./backend
      dockerfile: rag/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-dev_postgres_pwd}@db:5432/${POSTGRES_DB:-predicare}
      AGENT_DATABASE_URL: postgresql://agent_login:${DB_AGENT_RO_PASSWORD:-dev_agent_ro_pwd}@db:5432/${POSTGRES_DB:-predicare}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-https://api.openai.com/v1/embeddings}
      RAG_CORPUS_DIR: /corpus_rag
    volumes:
      - ./backend/rag/corpus_rag:/corpus_rag:ro
    depends_on:
      db:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
    restart: "no"

  # ---------- Registre des versions du modèle ----------
  mlflow:
    profiles: [ "full", "train" ]
    image: ghcr.io/mlflow/mlflow:v3.17.1
    restart: unless-stopped
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5000:5000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
  ml:
    profiles: [ "train" ] # lancé à la demande, pas à chaque "up"
    build: ./backend/ml
    restart: "no"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000 # utilisé seulement si mlflow tourne
    volumes:
      - ./backend/ingestion/dataset:/data/dataset:ro
      - ./backend/ingestion/labels:/data/labels:ro
      - ./backend/ml/models:/app/models
    depends_on:
      mlflow:
        condition: service_healthy
    
  # ---------- API FastAPI (modèle, RAG, rôles, administration) ----------
  api:
    profiles: [ "full" ] # a decommenter pour activer l'API dans le container
    build: ./backend
    restart: unless-stopped
    command: [ "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    environment:
      DATABASE_URL: postgresql://app_rw:${DB_APP_RW_PASSWORD:-dev_app_rw_pwd}@db:5432/${POSTGRES_DB:-predicare}
      AGENT_DATABASE_URL: postgresql://agent_login:${DB_AGENT_RO_PASSWORD:-dev_agent_ro_pwd}@db:5432/${POSTGRES_DB:-predicare}
      JWT_SECRET: ${JWT_SECRET:-cbdf0b301c8f45e529883ddba77e032165aa5274ceb34582bdacf22de5d8b301}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ALERT_THRESHOLD: ${ALERT_THRESHOLD:-0.7}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-https://api.openai.com/v1/embeddings}
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
      RAG_TOP_K: ${RAG_TOP_K:-6}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.35}
      CACHE_SIMILARITY_THRESHOLD: ${CACHE_SIMILARITY_THRESHOLD:-0.93}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
      mlflow:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-predicare}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------- Workflow d'alertes (Slack / Email) ----------
  n8n:
    profiles: [ "full" ] # a decommenter pour activer n8n dans le container
    image: n8nio/n8n:latest # à épingler sur une version précise
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-37019a45a5fd1b69caa80af583acd83d}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro # workflows .json à importer
    ports:
      - "5678:5678"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ---------- Frontend (Next.js généré avec v0/Bolt) ----------
  web:
    profiles: [ "full" ] # a decommenter pour activer le frontend dans le container
    build:
      context: ./frontend
      args:
        # Valeur intégrée au build : c'est le navigateur qui appelle l'API,
        # donc http://localhost:8000 (et non http://api:8000)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"

  # ---------- Sauvegardes PostgreSQL chiffrées (optionnelles) ----------
  # Activer avec : docker compose --profile backup up -d db-backup
  db-backup:
    profiles: [ "backup" ]
    build: ./db/backup
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-predicare}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_pwd}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
      loader:
        condition: service_completed_successfully

  # Metabase (service metabase) reads only the BI view using metabase_ro.

volumes:
  pgdata:
  mlflow_data:
  n8n_data: # prepared_data:

  n8n_data: # prepared_data:
