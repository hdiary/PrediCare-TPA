# Sert le frontend et le relie au backend : le navigateur n'appelle QUE ce serveur (/api/...).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # même limite que BodySizeLimitMiddleware côté API (1 Mo), y compris pour les envois « chunked »
    client_max_body_size 1m;

    # En-têtes de sécurité : nginx n'hérite PAS des add_header du niveau server dans un location qui
    # en déclare lui-même, d'où leur répétition dans les blocs / et /assets/ ci-dessous.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Les routes versionnées conservent leur chemin public /api/v1.
    location ^~ /api/v1/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # /api/xxx -> http://api:8000/xxx pour les routes historiques.
    location /api/ {
        resolver 127.0.0.11 valid=10s;      # DNS interne de Docker : nginx démarre même si l'API n'est pas prête
        set $backend http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # fichiers générés par Vite (nom avec empreinte) : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri =404;
    }

    # application monopage : toute autre adresse renvoie index.html (le routeur React prend le relais)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        try_files $uri /index.html;
    }
}
