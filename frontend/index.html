<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1C2120" />
    <title>PrediCare TPA</title>
    <meta name="description" content="Plateforme intelligente de détection de fraude pour TPA santé" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <div id="root">
      <style>
        .splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#fff;color:#0f766e;font:600 18px system-ui,sans-serif}
        @media (prefers-color-scheme:dark){.splash{background:#1C2120;color:#5eead4}}
        .splash-bar{width:160px;height:4px;border-radius:9999px;background:rgba(127,127,127,.25);overflow:hidden}
        .splash-bar i{display:block;height:100%;width:40%;border-radius:9999px;background:currentColor;animation:splash 1.2s ease-in-out infinite}
        @keyframes splash{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
        @media (prefers-reduced-motion:reduce){.splash-bar i{animation:none;width:100%}}
      </style>
      <div class="splash" role="status" aria-label="Chargement"><span>PrediCare TPA</span><div class="splash-bar"><i></i></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
